# Portainer stack — rebuild images, push to registry, then redeploy this stack in Portainer.
services:
  backend:
    image: 192.168.100.19:5000/hr-backend:latest
    restart: unless-stopped
    network_mode: host
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-production-secret}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-production-jwt-secret}
      ATTENDANCE_API_KEY: ${ATTENDANCE_API_KEY:-}
      MONGO_URI: ${MONGO_URI}
      FRONTEND_URL: ${FRONTEND_URL:-http://192.168.100.19:9093}
      ZK_SYNC_ENABLED: ${ZK_SYNC_ENABLED:-true}
      ZK_DEVICE_IP: ${ZK_DEVICE_IP:-192.168.100.5}
      ZK_DEVICE_PORT: ${ZK_DEVICE_PORT:-4370}
      ZK_DEVICE_PASSWORD: ${ZK_DEVICE_PASSWORD:-0}
      ZK_DEVICE_NAME: ${ZK_DEVICE_NAME:-ZKTeco K80}
      ZK_SYNC_TIMES: ${ZK_SYNC_TIMES:-08:00,08:30,09:00}
      ZK_SYNC_MIN_DATE: ${ZK_SYNC_MIN_DATE:-2022-01-01}
      ZK_DEVICE_TIMEOUT: ${ZK_DEVICE_TIMEOUT:-15}
      ZK_DEVICE_MAX_RETRIES: ${ZK_DEVICE_MAX_RETRIES:-5}
      ATTENDANCE_TIMEZONE: ${ATTENDANCE_TIMEZONE:-Africa/Algiers}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-True}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@hrmanagement.com}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5559/api/health', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: 192.168.100.19:5000/hr-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Backend runs with host network; API is on the Docker host port 5559
      NGINX_API_UPSTREAM: ${NGINX_API_UPSTREAM:-http://host.docker.internal:5559}
    ports:
      - "9093:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
