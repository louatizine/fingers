services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-local-secret}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-local-jwt-secret}
      MONGO_URI: mongodb://mongo:27017/hr_management_db
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      ZK_SYNC_ENABLED: ${ZK_SYNC_ENABLED:-false}
      ZK_DEVICE_IP: ${ZK_DEVICE_IP:-192.168.100.5}
      ZK_DEVICE_PORT: ${ZK_DEVICE_PORT:-4370}
      ZK_DEVICE_NAME: ${ZK_DEVICE_NAME:-ZKTeco K80}
      ZK_SYNC_INTERVAL_MINUTES: ${ZK_SYNC_INTERVAL_MINUTES:-5}
      ATTENDANCE_TIMEZONE: ${ATTENDANCE_TIMEZONE:-Africa/Algiers}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-True}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@hrmanagement.com}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  mongo_data:
